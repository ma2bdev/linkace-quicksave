<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="extName">LinkAce Quick Save</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <div id="notice" hidden>
      <span id="notice-icon" aria-hidden="true"></span>
      <p id="notice-text"></p>
      <button type="button" id="notice-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="popupOpenSettings">Open settings</span>
      </button>
    </div>

    <form id="save-form" hidden>
      <label for="url">
        <span data-i18n="popupUrlLabel">URL</span>
        <input id="url" type="url" required autocomplete="off" />
      </label>
      <p id="duplicate-warning" hidden></p>

      <label for="title">
        <span data-i18n="popupTitleLabel">Title</span>
        <input id="title" type="text" autocomplete="off" />
      </label>

      <label for="description">
        <span data-i18n="popupDescriptionLabel">Description</span>
        <textarea id="description" rows="2"></textarea>
      </label>

      <label for="tags">
        <span data-i18n="popupTagsLabel">Tags</span>
        <div class="autocomplete">
          <input id="tags" type="text" data-i18n-placeholder="popupTagsPlaceholder" autocomplete="off" />
          <ul id="tags-suggestions" class="suggestions" hidden></ul>
        </div>
      </label>

      <label for="lists">
        <span data-i18n="popupListsLabel">Lists</span>
        <div class="autocomplete">
          <input id="lists" type="text" data-i18n-placeholder="popupListsPlaceholder" autocomplete="off" />
          <ul id="lists-suggestions" class="suggestions" hidden></ul>
        </div>
      </label>

      <label for="visibility">
        <span data-i18n="popupVisibilityLabel">Visibility</span>
        <select id="visibility">
          <option value="1" data-i18n="popupVisibilityPublic">Public</option>
          <option value="2" data-i18n="popupVisibilityInternal">Internal</option>
          <option value="3" data-i18n="popupVisibilityPrivate">Private</option>
        </select>
      </label>

      <button type="submit" id="save-btn">
        <svg id="save-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        <span id="save-btn-label" data-i18n="popupSaveBtn">Save to LinkAce</span>
      </button>

      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="../lib/i18n.js"></script>
  <script src="../lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
